name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo check
